<head>

<meta property="og:site_name" content="TRANSMISSION">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TRANSMISSION — Conectando Spotify</title>
  <meta name="robots" content="noindex,nofollow">
  <style>html{color-scheme:dark}body{margin:0;min-height:100vh;background:#090909;color:#f2f2ed;display:grid;place-items:center;font-family:Arial,sans-serif}main{max-width:560px;padding:25px}h1{font-size:36px;letter-spacing:-.04em}p{line-height:1.5;color:#aaa}a{color:#e6ff60}</style>
  <script src="./spotify-auth.js?v=20261011connect1"></script>
</head>
<body><main><h1>TRANSMISSION / CONECTANDO…</h1><p id="message">Validando la autorización directamente con Spotify y regresando al reproductor.</p><a href="/">Volver al inicio ↗</a></main>
<script>
(async()=>{
  const node=document.getElementById('message');
  try{
    await window.TransmissionSpotify.processRedirect();
    const saved=sessionStorage.getItem('tm_return_to');
    sessionStorage.removeItem('tm_return_to');
    const destination=saved && saved.startsWith('/')&&!saved.startsWith('//')&&!saved.startsWith('/musica.html')?saved:'/';
    location.replace(destination);
  }catch(error){
    node.textContent='No se completó la conexión con Spotify: '+error.message+'. Regresa al inicio e inténtalo nuevamente.';
  }
})();
</script>
</body>
</html>
